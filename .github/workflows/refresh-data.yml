name: Refresh venue data

# OpenStreetMap から会場と駅を取り直す。
# 差分があればコミットし、その push で通常のデプロイが動いて本番に反映される。
#
# 手元から流すと Overpass に断られることがあるため、こちらから実行できるようにしてある。
on:
  schedule:
    - cron: '0 17 8 * *'  # 毎月9日 02:00（日本時間）
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-venue-data.py'
      - '.github/workflows/refresh-data.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 都道府県ごとに会場を取り、駅は全国ぶんを一度だけ取る。
      # 混んでいるときは待ち時間を延ばしながらミラーを順に試す。
      - name: Rebuild venues.json
        run: python scripts/build-venue-data.py database/data/venues.json

      - name: Commit if the data changed
        run: |
          if git diff --quiet -- database/data/venues.json; then
            echo "変更なし。コミットしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/data/venues.json
          git commit -m "会場データをOpenStreetMapの最新の内容に更新する

          scripts/build-venue-data.py の実行による更新。
          出典: OpenStreetMap contributors（ODbL 1.0）"

          # 取得に時間がかかる間に main が進んでいることがある。
          # そのままでは push が弾かれるので、取り込んでから送る。
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}

  # 取得したデータを本番へ届ける。
  deploy:
    needs: refresh
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
